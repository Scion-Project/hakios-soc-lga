# socs/lga/soc.conf: the facts of a Google Tensor G5 ("laguna", lga), whatever Pixel 10 it is in (frankel, blazer, mustang).
# Its own repository (Scion-Project/hakios-soc-lga), cloned here by tools/hakios-device.py sync; a phone with this SoC includes
# configs/lga.config from its defconfig. docs/porting/repositories.md has every word; README.md has each fact's source.

soc lga
	title       Google Tensor G5 (laguna, "lga")
	vendor      Google
	cores       8: two Cortex-A520 (0-1, MPIDR 0x000-0x100), five Cortex-A725 (2-6, 0x200-0x600), one Cortex-X4 (7, 0x700); the biggest is core 7
	gpu         Imagination PowerVR DXT-48-1536
	maintainer  Scion (README.md)
